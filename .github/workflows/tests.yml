name: Scientific language contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/Notations-Inference-Schematics-Engine
          ref: 42d1239d1be7cd515c5a57cbc4b98a2d31722051
          path: external/nise
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Install pinned NISE package for contract/pipeline qualification
        run: python -m pip install ./external/nise
      - name: Language parser tests
        run: python -m pytest -q --junitxml=nslr-tests.xml
      - name: Compile actual source and validate output with pinned NISE contract
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          nsl compile examples/bearing.nsl --output "$tmp/compiled.json"
          python - <<'PY' "$tmp/compiled.json" "$tmp/query.json"
          import json, sys
          from nise.contracts import validate_query
          value=json.load(open(sys.argv[1]))
          query=validate_query(value['query'])
          assert value['output_schema']=='nise.query.v1'
          assert value['claims']['provider_execution'] is False
          with open(sys.argv[2],'w',encoding='utf-8') as f:
              json.dump(query,f,indent=2,sort_keys=True)
              f.write('\n')
          PY
          nise compile external/nise/examples/bearing_catalog.json "$tmp/query.json" --output "$tmp/schematic.json"
          nise inspect "$tmp/schematic.json" > "$tmp/inspection.json"
          python - <<'PY' "$tmp/schematic.json" "$tmp/inspection.json"
          import json, sys
          schematic=json.load(open(sys.argv[1]))
          inspection=json.load(open(sys.argv[2]))
          assert schematic['schema']=='nise.inference-schematic.v1'
          assert schematic['claims']['candidate_structure'] is True
          assert schematic['claims']['physical_truth_established'] is False
          assert schematic['claims']['execution_authority'] is False
          assert 'fault.classify.v1' in schematic['unresolved_capabilities']
          assert all(n['status']!='HYPOTHESIZED'
                     for key in ('V_q','M_q','C_q','O_q','P_q')
                     for n in schematic[key])
          assert inspection['schematic_id']==schematic['schematic_id']
          PY
      - name: Require no failures/errors/skips
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E
          suites=list(E.parse('nslr-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 10
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          PY
